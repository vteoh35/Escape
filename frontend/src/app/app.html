<main class="container">
  <h1>Escape</h1>
  <h2>Tasks</h2>

  <div class="add-task">
    <input
      type="text"
      [(ngModel)]="newTaskName"
      placeholder="Enter a task"
      (keyup.enter)="addTask()"
    />

    <button (click)="addTask()">
      Add Task
    </button>
  </div>

  <div class="tasks">

    @for (task of tasks; track task.id) {

      <div class="task">
        <input
          type="checkbox"
          [checked]="task.isCompleted"
          (change)="toggleTask(task)"
        />

        <span [class.completed]="task.isCompleted">
          {{ task.name }}
        </span>

        <button
          class="delete"
          (click)="deleteTask(task.id)"
        >
          Delete
        </button>
      </div>

    } @empty {

      <p>No tasks yet.</p>

    }

  </div>
</main>
