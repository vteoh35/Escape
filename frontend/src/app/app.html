<main class="container">
  <h1>Escape</h1>
  <h2>Tasks</h2>

  <div class="auth">
    @if (auth.isLoggedIn()) {

      <span>Logged in as {{ auth.employeeId() }}</span>
      <button (click)="logout()">Log out</button>

    } @else {

      <input
        type="text"
        [(ngModel)]="loginEmployeeId"
        placeholder="Employee ID"
        (keyup.enter)="login()"
      />

      <input
        type="password"
        [(ngModel)]="loginPassword"
        placeholder="Password"
        (keyup.enter)="login()"
      />

      <button (click)="login()">Log in</button>

      @if (loginError) {
        <p class="auth-error">{{ loginError }}</p>
      }

    }
  </div>

  @if (auth.isLoggedIn()) {

    <div class="add-task">
      <input
        type="text"
        [(ngModel)]="newTaskName"
        placeholder="Enter a task"
        (keyup.enter)="addTask()"
      />

      <button (click)="addTask()">
        Add Task
      </button>
    </div>

  }

  <div class="tasks">

    @for (task of tasks(); track task.taskId) {

      <div class="task">
        <span>
          {{ task.name }}
        </span>

        @if (auth.isLoggedIn()) {
          <button
            class="delete"
            (click)="deleteTask(task.taskId)"
          >
            Delete
          </button>
        }
      </div>

    } @empty {

      <p>No tasks yet.</p>

    }

  </div>
</main>
